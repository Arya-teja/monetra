version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/postgres/queries
    gen:
      go:
        package: db
        out: internal/repository/postgres/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true

<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2eb" />
    <title>Offline · Monetra</title>
    <!-- Standalone page served by the service worker without the app, so colors are
         the PRD §9 values written out instead of CSS tokens. -->
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f2eb;
        color: #2f3526;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .logo {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #8b9a6e;
        color: #ffffff;
        font-size: 28px;
        font-weight: 700;
      }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #5c6052; line-height: 1.5; }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #56663f;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="logo" aria-hidden="true">M</span>
      <h1>Kamu sedang offline</h1>
      <p>Monetra butuh koneksi internet untuk menampilkan dan mencatat transaksi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
